# Reticulum config snippet — RTAK Inlet
#
# Append to /etc/reticulum/config on the OmniNode to enable the TCP inlet.
# setup_inlet.sh does this automatically — this file is a reference copy.
#
# For remote nodes that connect TO the inlet, add the TCPClientInterface
# block at the bottom to their Reticulum config.

# ---------------------------------------------------------------------------
# OmniNode side — TCP server (add to OmniNode's Reticulum config)
# ---------------------------------------------------------------------------

# Basic mode: Reticulum listens directly on external port 4242
# Replace with 127.0.0.1:4242 if using stunnel (stealth mode)
[interface:tcp_inlet]
  type            = TCPServerInterface
  interface_enabled = True
  listen_ip       = 0.0.0.0     # 127.0.0.1 in stealth/stunnel mode
  listen_port     = 4242         # stunnel wraps this at port 443 in stealth mode

# ---------------------------------------------------------------------------
# Remote node side — TCP client (add to remote node's Reticulum config)
# ---------------------------------------------------------------------------

# Basic mode: connect directly to OmniNode's public IP on port 4242
# [interface:rtak_inlet]
#   type            = TCPClientInterface
#   interface_enabled = True
#   target_host     = <omninode-public-ip-or-hostname>
#   target_port     = 4242

# Stealth mode: connect to TLS-wrapped inlet on port 443
# [interface:rtak_inlet]
#   type            = TCPClientInterface
#   interface_enabled = True
#   target_host     = <omninode-public-ip-or-hostname>
#   target_port     = 443

# ---------------------------------------------------------------------------
# I2P mode (optional — maximum endpoint anonymity)
# ---------------------------------------------------------------------------
# Requires i2pd running on both nodes. Hides both IP addresses at the cost
# of ~2-5s additional latency and reduced bandwidth.
#
# [interface:rtak_i2p]
#   type            = I2PInterface
#   interface_enabled = True
#   peers           = <remote-node-i2p-b32-address>.b32.i2p
