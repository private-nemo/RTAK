# Reticulum config — RTAK RelayNode
# Deploy to: /etc/reticulum/config
#
# This config enables transport mode, which is the single setting
# that makes any Reticulum node a full mesh relay. Packets received
# on any interface are forwarded to all other interfaces automatically.
# LXMF messages are also buffered for store-and-forward delivery
# when a destination node is temporarily out of range.
#
# RF settings (frequency, bandwidth, spreadingfactor, codingrate)
# MUST match identically on all OmniNodes in the network.
# Any mismatch = complete deafness between nodes.

[reticulum]
  enable_transport       = True
  share_instance         = Yes
  shared_instance_port   = 37428
  instance_control_port  = 37429

# 915 MHz LoRa — T-Beam Supreme (SX1262)
# Default USB serial port when connected first via OTG hub
[interface:lora_915]
  type              = RNodeInterface
  interface_enabled = True
  port              = /dev/ttyUSB0
  frequency         = 915000000
  bandwidth         = 125000
  txpower           = 17
  spreadingfactor   = 8
  codingrate        = 5

# 433 MHz LoRa — T-Beam v1.1 (SX1278)
# Default USB serial port when connected second via OTG hub
[interface:lora_433]
  type              = RNodeInterface
  interface_enabled = True
  port              = /dev/ttyUSB1
  frequency         = 433000000
  bandwidth         = 125000
  txpower           = 17
  spreadingfactor   = 8
  codingrate        = 5

# WiFi/LAN — auto-discovers other Reticulum nodes on local network
# Useful if relay is mounted near a structure with WiFi access
[interface:local_auto]
  type              = AutoInterface
  interface_enabled = True
